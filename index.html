<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستكشف الفلاتر الأثرية DStretch Pro</title>
    <!-- ربط التطبيق بملف التثبيت -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; margin: 0; }
        h1 { font-size: 1.4rem; color: #ff9800; margin-bottom: 5px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input[type="file"], select, input[type="range"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        select { background: #333; color: white; font-size: 1rem; }
        canvas { max-width: 100%; height: auto; margin-top: 15px; border-radius: 8px; background: #000; display: block; margin-left: auto; margin-right: auto; }
        button { background: #ff9800; color: #000; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn-install { background: #4CAF50; color: white; display: none; margin-bottom: 15px; }
        label { display: block; text-align: right; font-size: 0.9rem; color: #bbb; }
    </style>
</head>
<body>

<div class="container">
    <h1>مُعالج النقوش DStretch Pro</h1>
    <button id="installBtn" class="btn-install">⬇️ تثبيت التطبيق على الهاتف</button>
    
    <input type="file" id="upload" accept="image/*">
    
    <label>اختر مصفوفة DStretch الاحترافية:</label>
    <select id="filterSelect">
        <option value="none">الأصلي (بدون فلتر)</option>
        <option value="yrd">YRD (إظهار الصبغات الحمراء والمغرة الباهتة)</option>
        <option value="yre">YRE (إظهار الصبغات الصفراء والبنية)</option>
        <option value="ydt">YDT (الفلتر العام المحسن للتفاصيل المخفية)</option>
        <option value="ybk">YBK (إبراز الفحم والنقوش السوداء والداكنة)</option>
        <option value="ycbcr_cr">ycbcr_cr (فصل الألوان وفحص الكرومينانس)</option>
        <option value="lab_l">LAB_L (إضاءة عادية متباينة جداً)</option>
    </select>

    <label id="stretchLabel">قوة التمديد والتباين (Stretch): 1.5</label>
    <input type="range" id="stretch" min="0.5" max="5" step="0.1" value="1.5">

    <canvas id="out"></canvas>
    
    <button onclick="download()">تنزيل الصورة المعالجة</button>
</div>

<script>
let imgElement = new Image();
let curFilter = 'none';

document.getElementById('upload').onchange = function(e) {
    if (e.target.files && e.target.files[0]) {
        let reader = new FileReader();
        reader.onload = function(event) {
            imgElement.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    }
};

imgElement.onload = function() {
    applyFilter(curFilter);
};

document.getElementById('filterSelect').onchange = function(e) {
    curFilter = e.target.value;
    if(imgElement.src && imgElement.complete) applyFilter(curFilter);
};

document.getElementById('stretch').oninput = function(e) {
    document.getElementById('stretchLabel').innerText = `قوة التمديد والتباين (Stretch): ${e.target.value}`;
    if(imgElement.src && imgElement.complete) applyFilter(curFilter);
};

function applyFilter(name) {
    let canvas = document.getElementById('out');
    let outCtx = canvas.getContext('2d');
    
    let maxDim = 1200;
    let w = imgElement.width;
    let h = imgElement.height;
    if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } 
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
    }
    
    canvas.width = w;
    canvas.height = h;
    outCtx.drawImage(imgElement, 0, 0, w, h);
    
    let imgData = outCtx.getImageData(0, 0, w, h);
    let src = imgData.data;
    let n = src.length;
    let dst = new Uint8ClampedArray(n);
    let stretch = parseFloat(document.getElementById('stretch').value);

    let stats = {r:0, g:0, b:0};
    for(let i=0; i<n; i+=4) {
        stats.r += src[i]; stats.g += src[i+1]; stats.b += src[i+2];
    }
    let count = n/4;
    let avg = {r: stats.r/count, g: stats.g/count, b: stats.b/count};

    for(let i=0; i<n; i+=4) {
        let r = src[i], g = src[i+1], b = src[i+2];
        let nr, ng, nb;

        // مصفوفات حسابية مستوحاة من معادلات DStretch الرسمية لإبراز الصبغات الأثرية
        if (name === 'yrd') {
            nr = r * 1.5 - g * 0.4 - b * 0.1;
            ng = -r * 0.2 + g * 1.5 - b * 0.3;
            nb = -r * 0.3 - g * 0.3 + b * 1.6;
        } else if (name === 'yre') {
            nr = r * 1.4 - b * 0.4;
            ng = g * 1.4 - b * 0.4;
            nb = -r * 0.3 - g * 0.3 + b * 1.6;
        } else if (name === 'ydt') {
            let k = (r + g + b) / 3;
            nr = r * 1.6 - k * 0.6;
            ng = g * 1.4 - k * 0.4;
            nb = b * 1.2 - k * 0.2;
        } else if (name === 'ybk') {
            let inv = 255 - ((r+g+b)/3);
            nr = inv * 1.2; ng = inv * 1.2; nb = inv * 1.2;
        } else if(name === 'ycbcr_cr') {
            nr = 0.5 * r - 0.418 * g - 0.081 * b + 128;
            ng = nr; nb = nr;
        } else if (name === 'lab_l') {
            let luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            nr = luminance; ng = luminance; nb = luminance;
        } else {
            nr = r; ng = g; nb = b;
        }

        dst[i]   = Math.min(255, Math.max(0, (nr - avg.r) * stretch + avg.r));
        dst[i+1] = Math.min(255, Math.max(0, (ng - avg.g) * stretch + avg.g));
        dst[i+2] = Math.min(255, Math.max(0, (nb - avg.b) * stretch + avg.b));
        dst[i+3] = 255;
    }

    outCtx.putImageData(new ImageData(dst, w, h), 0, 0);
}

function download() {
    let link = document.createElement('a');
    link.download = 'dstretch_pro_result.png';
    link.href = document.getElementById('out').toDataURL('image/png');
    link.click();
}

// كود تفعيل زر التثبيت للهواتف
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') { deferredPrompt = null; document.getElementById('installBtn').style.display = 'none'; }
    }
});
</script>
</body>
</html>
