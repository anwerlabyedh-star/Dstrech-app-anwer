<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستكشف الفلاتر الأثرية DStretch</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; margin: 0; }
        h1 { font-size: 1.4rem; color: #ff9800; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input[type="file"], select, input[type="range"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        select { background: #333; color: white; font-size: 1rem; }
        canvas { max-width: 100%; height: auto; margin-top: 15px; border-radius: 8px; background: #000; }
        button { background: #ff9800; color: #000; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        label { display: block; text-align: right; font-size: 0.9rem; color: #bbb; }
    </style>
</head>
<body>

<div class="container">
    <h1>مُعالج النقوش الصخرية (DStretch)</h1>
    
    <input type="file" id="upload" accept="image/*">
    
    <label>اختر الفلتر المناسب للنقش:</label>
    <select id="filterSelect">
        <option value="none">الأصلي (بدون فلتر)</option>
        <option value="ycbcr_cr">ycbcr_cr (إبراز الكرومينانس)</option>
        <option value="yrd">YRD (ممتاز للصبغات الحمراء)</option>
        <option value="yre">YRE (ممتاز للصبغات الصفراء الباهتة)</option>
        <option value="lab_l">LAB_L (تعزيز تباين الإضاءة العام)</option>
        <option value="lds">LDS (تعزيز القنوات الحادة)</option>
    </select>

    <label id="stretchLabel">قوة التمديد والتباين: 1.5</label>
    <input type="range" id="stretch" min="0.5" max="5" step="0.1" value="1.5">

    <canvas id="out"></canvas>
    
    <button onclick="download()">تنزيل الصورة المعالجة</button>
</div>

<script>
let imgElement = new Image();
let curFilter = 'none';

document.getElementById('upload').onchange = function(e) {
    let reader = new FileReader();
    reader.onload = function(event) {
        imgElement.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files);
};

imgElement.onload = function() {
    applyFilter(curFilter);
};

document.getElementById('filterSelect').onchange = function(e) {
    curFilter = e.target.value;
    if(imgElement.src) applyFilter(curFilter);
};

document.getElementById('stretch').oninput = function(e) {
    document.getElementById('stretchLabel').innerText = `قوة التمديد والتباين: ${e.target.value}`;
    if(imgElement.src) applyFilter(curFilter);
};

function applyFilter(name) {
    let canvas = document.getElementById('out');
    let outCtx = canvas.getContext('2d');
    
    canvas.width = imgElement.width;
    canvas.height = imgElement.height;
    outCtx.drawImage(imgElement, 0, 0);
    
    let imgData = outCtx.getImageData(0, 0, canvas.width, canvas.height);
    let src = imgData.data;
    let n = src.length;
    let dst = new Uint8ClampedArray(n);
    let stretch = parseFloat(document.getElementById('stretch').value);

    let stats = {r:0, g:0, b:0};
    for(let i=0; i<n; i+=4) {
        stats.r += src[i];
        stats.g += src[i+1];
        stats.b += src[i+2];
    }
    let count = n/4;
    let avg = {r: stats.r/count, g: stats.g/count, b: stats.b/count};

    for(let i=0; i<n; i+=4) {
        let r = src[i], g = src[i+1], b = src[i+2];
        let nr, ng, nb;

        if(name === 'ycbcr_cr') {
            nr = 0.5 * r - 0.418 * g - 0.081 * b + 128;
            ng = nr; nb = nr;
        } else if (name === 'yrd') {
            nr = r * 1.4 - g * 0.4 - b * 0.2;
            ng = -r * 0.2 + g * 1.4 - b * 0.2;
            nb = -r * 0.2 - g * 0.4 + b * 1.6;
        } else if (name === 'yre') {
            nr = r * 1.3 - b * 0.3;
            ng = g * 1.3 - b * 0.3;
            nb = -r * 0.2 - g * 0.2 + b * 1.4;
        } else if (name === 'lab_l') {
            let column = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            nr = column; ng = column; nb = column;
        } else if(name === 'lds') {
            nr = r * 1.5; ng = g * 0.8; nb = b * 0.5;
        } else {
            nr = r; ng = g; nb = b;
        }

        dst[i]   = Math.min(255, Math.max(0, (nr - avg.r) * stretch + avg.r));
        dst[i+1] = Math.min(255, Math.max(0, (ng - avg.g) * stretch + avg.g));
        dst[i+2] = Math.min(255, Math.max(0, (nb - avg.b) * stretch + avg.b));
        dst[i+3] = 255;
    }

    outCtx.putImageData(new ImageData(dst, canvas.width, canvas.height), 0, 0);
}

function download() {
    let link = document.createElement('a');
    link.download = 'dstretch_enhanced.png';
    link.href = document.getElementById('out').toDataURL();
    link.click();
}
</script>
</body>
</html>
