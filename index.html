<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DStretch Pro - محسّن الرسوم الصخرية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151a">
<style>
  @import url('https://googleapis.com');

  :root {
    --bg: #0a0c0f;
    --surface: #12151a;
    --surface2: #1a1f28;
    --border: #2a3040;
    --accent: #c8a84b;
    --text: #e8e2d4;
    --text-dim: #8a8070;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    text-align: center;
  }

  .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
  .subtitle { font-size: 0.8rem; color: var(--text-dim); }

  .main { padding: 15px; display: flex; flex-direction: column; gap: 15px; flex: 1; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin-bottom: 0.8rem; text-align: right; }

  .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .filter-btn {
    padding: 0.7rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .slider-group { margin-bottom: 0.8rem; }
  .slider-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }
  .slider-val { color: var(--accent); font-weight: 600; }

  input[type=range] { width: 100%; -webkit-appearance: none; height: 6px; background: var(--border); border-radius: 3px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }

  .btn-action { width: 100%; padding: 0.8rem; border: none; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 5px; }
  .btn-primary { background: var(--accent); color: #000; }

  .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; cursor: pointer; background: var(--surface); margin-bottom: 5px; }
  .upload-icon { font-size: 2rem; margin-bottom: 0.3rem; }
  
  .canvas-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-top: 10px; }
  .canvas-label { padding: 0.5rem 1rem; font-size: 0.8rem; color: var(--text-dim); border-bottom: 1px solid var(--border); text-align: right; }
  canvas { display: block; width: 100%; max-height: 350px; object-fit: contain; background: #000; }
  #fileInput { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">⬡ DStretch Pro</div>
  <div class="subtitle">محسّن الرسوم الصخرية — تقنية تمديد التباين اللوني</div>
</header>

<div class="main">
  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📁</div>
    <div class="drop-zone-text" id="statusText">اضغط هنا لاختيار صورة من الاستوديو أو الكاميرا</div>
  </div>
  <!-- تعديل مهم لقبول الكاميرا والملفات في الأندرويد بسلاسة -->
  <input type="file" id="fileInput" accept="image/*">

  <div class="card">
    <div class="section-title">قنوات DStretch</div>
    <div class="filter-grid">
      <button class="filter-btn active" onclick="setFilter('none', this)">الأصلي</button>
      <button class="filter-btn" onclick="setFilter('lgr', this)">LGR (أزرق/أحمر)</button>
      <button class="filter-btn" onclick="setFilter('lrd', this)">LRD (باهت)</button>
      <button class="filter-btn" onclick="setFilter('lre', this)">LRE (مغرة)</button>
      <button class="filter-btn" onclick="setFilter('yrd', this)">YRD (أحمر Pro)</button>
      <button class="filter-btn" onclick="setFilter('yre', this)">YRE (أصفر Pro)</button>
      <button class="filter-btn" onclick="setFilter('lds', this)">LDS (حاد)</button>
      <button class="filter-btn" onclick="setFilter('ycbcr', this)">YCbCr Cr</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">إعدادات التحسين</div>
    <div class="slider-group">
      <div class="slider-label"><span>قوة التمديد</span><span class="slider-val" id="val-stretch">2.0</span></div>
      <input type="range" id="sl-stretch" min="1" max="5" step="0.1" value="2.0" oninput="document.getElementById('val-stretch').textContent=this.value; reapply()">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>السطوع</span><span class="slider-val" id="val-brightness">1.00</span></div>
      <input type="range" id="sl-brightness" min="0.5" max="2" step="0.05" value="1.00" oninput="document.getElementById('val-brightness').textContent=parseFloat(this.value).toFixed(2); reapply()">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>التباين</span><span class="slider-val" id="val-contrast">1.00</span></div>
      <input type="range" id="sl-contrast" min="0.5" max="2" step="0.05" value="1.00" oninput="document.getElementById('val-contrast').textContent=parseFloat(this.value).toFixed(2); reapply()">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>حدة الحواف</span><span class="slider-val" id="val-sharp">1.0</span></div>
      <input type="range" id="sl-sharp" min="1" max="3" step="0.1" value="1.0" oninput="document.getElementById('val-sharp').textContent=this.value; reapply()">
    </div>
  </div>

  <div class="canvas-panel">
    <div class="canvas-label">النتيجة المعالجة بدستريتش:</div>
    <canvas id="outCanvas"></canvas>
    <button class="btn-action btn-primary" onclick="downloadImg()">⬇️ تحميل وتنزيل النتيجة</button>
  </div>
</div>

<script>
let imgElement = new Image();
let curFilter = 'none';

document.getElementById('fileInput').onchange = function(e) {
  if (e.target.files && e.target.files[0]) {
    document.getElementById('statusText').textContent = "جاري تحميل الصورة...";
    let file = e.target.files[0];
    let reader = new FileReader();
    
    reader.onload = function(event) {
      imgElement.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }
};

imgElement.onload = function() {
  document.getElementById('statusText').textContent = "تمت إضافة الصورة بنجاح ✅";
  reapply();
};

function setFilter(name, btn) {
  curFilter = name;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  reapply();
}

function reapply() {
  if (!imgElement.src) return;
  let canvas = document.getElementById('outCanvas');
  let ctx = canvas.getContext('2d');
  
  // تصغير الحجم البرمجي لـ 600 بكسل لتفادي أي ثقل أو كراش في نظام الأندرويد
  let maxDim = 600; 
  let w = imgElement.width, h = imgElement.height;
  if (w > maxDim || h > maxDim) {
    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } else { w = Math.round((w * maxDim) / h); h = maxDim; }
  }
  
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(imgElement, 0, 0, w, h);
  
  try {
    let imgData = ctx.getImageData(0, 0, w, h);
    let src = imgData.data, n = src.length;
    let dst = new Uint8ClampedArray(n);
    
    let stretch = parseFloat(document.getElementById('sl-stretch').value);
    let brightness = parseFloat(document.getElementById('sl-brightness').value);
    let contrast = parseFloat(document.getElementById('sl-contrast').value);
    let sharp = parseFloat(document.getElementById('sl-sharp').value);

    let stats = {r:0, g:0, b:0};
    for(let i=0; i<n; i+=4) { stats.r += src[i]; stats.g += src[i+1]; stats.b += src[i+2]; }
    let count = n/4, avg = {r: stats.r/count, g: stats.g/count, b: stats.b/count};

    for(let i=0; i<n; i+=4) {
      let r = src[i], g = src[i+1], b = src[i+2];
      let nr = r, ng = g, nb = b;

      if (curFilter === 'lgr') {
        nr = b * 1.6 - r * 0.6; ng = r * 1.6 - g * 0.6; nb = g * 1.6 - b * 0.6;
      } else if (curFilter === 'lrd') {
        nr = r * 2.0 - g * 0.7 - b * 0.3; ng = g; nb = b;
      } else if (curFilter === 'lre') {
        nr = r * 1.6 - g * 0.6; ng = g * 1.4 - r * 0.4; nb = b;
      } else if (curFilter === 'yrd') {
        nr = r * 1.7 - g * 0.5 - b * 0.2; ng = -r * 0.1 + g * 1.3; nb = b * 1.4;
      } else if (curFilter === 'yre') {
        nr = r * 1.4 - b * 0.4; ng = g * 1.4 - b * 0.4; nb = b * 0.8;
      } else if (curFilter === 'lds') {
        nr = r * 1.5; ng = g * 0.8; nb = b * 0.5;
      } else if (curFilter === 'ycbcr') {
        let cr = 0.5 * r - 0.418 * g - 0.081 * b + 128;
        nr = cr; ng = cr; nb = cr;
      }

      let finalR = ((nr - avg.r) * stretch + avg.r) * brightness;
      let finalG = ((ng - avg.g) * stretch + avg.g) * brightness;
      let finalB = ((nb - avg.b) * stretch + avg.b) * brightness;

      finalR = (finalR - 128) * contrast + 128;
      finalG = (finalG - 128) * contrast + 128;
      finalB = (finalB - 128) * contrast + 128;

      dst[i]   = Math.min(255, Math.max(0, finalR * sharp));
      dst[i+1] = Math.min(255, Math.max(0, finalG * sharp));
      dst[i+2] = Math.min(255, Math.max(0, finalB * sharp));
      dst[i+3] = 255;
    }
